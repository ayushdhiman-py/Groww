<script type="module">
import { fetchTrialFeed, renderTrialTable } from './trial-ui.mjs';

async function init() {
  document.title = 'Trial Feed';
  const container = document.getElementById('trial-root');
  container.innerHTML = '<div id="trialPanel">Loading trial feed…</div>';
  const feed = await fetchTrialFeed();
  renderTrialTable(feed);
  setInterval(async () => {
    const f = await fetchTrialFeed();
    renderTrialTable(f);
  }, 60_000);
}

init();
</script>
