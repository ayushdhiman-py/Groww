services:
  - type: web
    name: ayush-groww-scanner
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: node scanner_testing.mjs
    envVars:
      - key: NODE_VERSION
        value: 22.x
      - key: UPSTOX_ACCESS_TOKEN
        sync: false
      - key: PORT
        value: 10000
    healthCheckPath: /api/status
    autoDeploy: true
